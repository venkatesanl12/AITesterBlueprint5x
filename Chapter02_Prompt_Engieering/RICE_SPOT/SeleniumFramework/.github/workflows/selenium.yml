name: Salesforce Selenium

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Sandbox configuration
        type: choice
        options: [dev, qa, uat]
        default: dev
      suite:
        description: Test suite
        type: choice
        options: [smoke, regression]
        default: smoke
  push:
    paths:
      - "Chapter02_Prompt_Engieering/RICE_SPOT/SeleniumFramework/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Chapter02_Prompt_Engieering/RICE_SPOT/SeleniumFramework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: browser-actions/setup-chrome@v1
      - name: Install Allure CLI
        run: npm install --global allure-commandline
      - name: Run selected suite
        run: >
          mvn -B -P"${{ inputs.suite || 'smoke' }}" test
          -Denvironment="${{ inputs.environment || 'dev' }}"
          -Dconfig.file="src/test/resources/config/${{ inputs.environment || 'dev' }}.properties"
          -Dbrowser=chrome -Dheadless=true
        env:
          SF_BASE_URL: ${{ secrets.SF_BASE_URL }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
          SF_ACCESS_TOKEN: ${{ secrets.SF_ACCESS_TOKEN }}
      - name: Generate Allure HTML report
        if: always()
        run: allure generate target/allure-results --clean -o target/allure-report
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-${{ inputs.suite || 'smoke' }}-reports
          path: |
            target/surefire-reports
            target/allure-report
            target/allure-results
